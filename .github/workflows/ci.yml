name: CI

# deploy.yml already runs the same lint/typecheck/test/build gate on push to
# main, so we only need this workflow for PRs.
on:
  pull_request:
    branches: [main]

# Read-only GITHUB_TOKEN: nothing here writes to the repo. No secrets: PR
# code runs here.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No secrets in this workflow: npm cache and install scripts allowed.
      - uses: ./.github/actions/setup
        with:
          cache: 'true'
          ignore-scripts: 'false'

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        env:
          # Cloudflare's public always-pass TEST site key, so the export renders
          # the Turnstile widget as production does; e2e/fixtures.ts serves a
          # stand-in api.js — no test reaches Cloudflare. deploy.yml builds
          # with the real key.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build
      # The Worker bundle and wrangler.jsonc as `wrangler deploy` would upload
      # them — no credentials needed. Without it a bundling error surfaced only
      # in deploy.yml, after the merge.
      - run: npx wrangler deploy --dry-run
      # After the build: the UI dictionary must stay in one shared chunk
      # (next.config.mjs turbopackChunking — an experimental key a Next
      # upgrade can drop with only a warning).
      - run: npm run check:dict
      # Needs out/: the WAF expression must block no URL the build serves.
      - run: npm run check:waf
      # Every page's baked-in CSP covers each of its inline scripts.
      - run: npm run check:csp

      # For the browser tests. out/ has a dot-directory
      # (.well-known/security.txt), which upload-artifact skips unless told.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Browser tests on the built export (playwright.config.ts, e2e/): the user
  # flows, axe in both themes, no console error or CSP violation. In the
  # official Playwright image, which brings Chromium, WebKit and their system
  # packages — installing them on the bare runner took 3–37 min. Only the
  # tests run in it, on the out/ the build job made and checked (one build
  # per run).
  # The tag must equal @playwright/test's version (tests/repo/workflows.test.ts),
  # the digest pins it like the actions' SHAs; uid 1001 is the runner's, so
  # the checkout stays writable.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No secrets in this workflow: npm cache and install scripts allowed.
      - uses: ./.github/actions/setup
        with:
          cache: 'true'
          ignore-scripts: 'false'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out/

      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  # Lints every workflow and .github/actions/setup: syntax, expressions,
  # needs/outputs, action inputs. Most ops workflows only run by hand, so a
  # mistake there would otherwise surface on the day they are needed. Built
  # by `go run` at a fixed version (the Go checksum database verifies the
  # module; Dependabot doesn't bump it — do it by hand). Its shellcheck
  # pass covers `run:` blocks (shellcheck is preinstalled on ubuntu-latest);
  # the next step covers the standalone scripts. pyflakes stays off: no
  # Python in run blocks.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color -pyflakes=
        env:
          SHELLCHECK_OPTS: --severity=warning
      - run: shellcheck --version && shellcheck --severity=warning scripts/*.sh .claude/hooks/*.sh

  # Every commit on the PR is the owner's (by GitHub account, as the API maps
  # its author e-mail) and has no Co-authored-by line. A squash merge credits
  # every other commit author as a co-author, and the repository's
  # Contributors box counts co-authors: dependabot[bot] got in that way through
  # #39 (docs/history.md). So a Dependabot PR stays red and is never merged;
  # a session redoes the bump from main (.github/CLAUDE.md). No checkout: the
  # PR's commit list comes from the API. The log names logins, never e-mails.
  authors:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          COMMITS: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits
        run: |
          gh api --paginate "$COMMITS" --jq '.[] | [.sha[0:7], (.author.login // "-"), (.commit.message | test("(^|\n)[ \t]*co-authored-by:"; "i") | tostring)] | @tsv' > commits.tsv
          bad=0
          while IFS=$'\t' read -r sha login coauthor; do
            if [ "$login" != "$OWNER" ]; then
              echo "::error::$sha is authored by ${login/#-/an e-mail no GitHub account has}, not $OWNER"
              bad=1
            fi
            if [ "$coauthor" = true ]; then
              echo "::error::$sha has a Co-authored-by line"
              bad=1
            fi
          done < commits.tsv
          exit "$bad"

  # The one required status check on main (branch protection names `check`):
  # green only when every job above is. `always()` so a failed or skipped
  # job makes it red rather than skipped — a skipped required check passes.
  check:
    needs: [build, e2e, actionlint, authors]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD" = success && test "$E2E" = success && test "$ACTIONLINT" = success && test "$AUTHORS" = success
        env:
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          AUTHORS: ${{ needs.authors.result }}
