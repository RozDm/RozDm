name: Bootstrap D1 (one-shot)

# Manual workflow that creates the metrics D1 database (when missing) and
# applies the pending migrations in migrations/ (`wrangler d1 migrations
# apply`; the d1_migrations table records what ran, so a re-run is a no-op).
# Run from the Actions tab → "Run workflow": once to create the database
# (then wire the database_id it prints into wrangler.jsonc), and again after
# each new migration file lands on main.
on:
  workflow_dispatch:

# Read-only GITHUB_TOKEN: nothing here writes to the repo; Cloudflare access
# comes from the CLOUDFLARE_API_TOKEN secret, not from GitHub.
permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # Secrets live in the `production` environment (deployable from main
    # only); without this line the job gets none.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The defaults, as in deploy.yml's job with secrets: no npm cache, no
      # install scripts — package code must not run next to the token.
      - uses: ./.github/actions/setup

      - name: Create D1 database (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler d1 list --json | grep -q '"name": "rozsoshnykh-metrics-v2"'; then
            echo "rozsoshnykh-metrics-v2 already exists"
          else
            # --binding patches this checkout's wrangler.jsonc (METRICS keeps
            # its migrations_dir) so the apply below reaches the new id.
            npx wrangler d1 create rozsoshnykh-metrics-v2 --binding METRICS
          fi
          echo "--- Existing D1 databases ---"
          npx wrangler d1 list

      # Non-interactive in CI: wrangler skips its confirmation (fallback "yes")
      # and Time Travel keeps the pre-migration state restorable. A failing
      # migration is rolled back; the earlier ones stay applied.
      - name: Apply pending migrations (idempotent — d1_migrations records them)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply METRICS --remote

      - name: Print database_id for wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=========================================="
          echo "Copy the uuid below into wrangler.jsonc"
          echo "=========================================="
          npx wrangler d1 list --json | python3 -c "import json,sys; [print(d['uuid']) for d in json.load(sys.stdin) if d['name']=='rozsoshnykh-metrics-v2']"
