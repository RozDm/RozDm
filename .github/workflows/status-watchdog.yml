name: Status watchdog

# Watches the watcher. The Worker's 5-minute cron probes the monitored
# services and mails on outages — but if the cron itself stops (or KV writes
# start failing), nothing mails anyone: the site just greys out its status
# card (isStale). This runs outside Cloudflare and FAILS when the snapshot is
# stale or the site is down; GitHub then e-mails the failure to whoever last
# changed this schedule. Free: public-repo Actions minutes.
#
# Four slots an hour, because GitHub starts only some scheduled runs: with one
# slot an hour (`17 * * * *`) about one in seven ran — 3.7 to 11 hours apart,
# 6.5 on average (2026-11-03…10). None on the hour, which GitHub names as its
# busiest time. A run takes seconds, and the concurrency group below lets a
# late one give way to the next. While something is failing, every run that
# does start mails: expect more mail than one slot an hour brought.
#
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity — re-enable it from the Actions tab if that ever happens.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    # The `cpu` job's slots (below). Four a day for the same reason as above.
    - cron: '44 1,7,13,19 * * *'
  workflow_dispatch:

# Read-only GITHUB_TOKEN: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: status-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 \
            -A 'status-watchdog/1.0 (+https://github.com/RozDm/RozDm)' https://rozsoshnykh.no/)
          echo "GET / -> $code"
          [ "$code" = "200" ] || { echo "::error::rozsoshnykh.no answered $code"; exit 1; }

      # 25 min = the Worker's 20-minute STALE_AFTER_MS plus slack for the
      # 60 s edge cache and a late cron tick.
      - name: Status snapshot is fresh
        run: |
          body=$(curl -sf --max-time 20 --retry 2 --retry-delay 10 \
            -A 'status-watchdog/1.0 (+https://github.com/RozDm/RozDm)' https://rozsoshnykh.no/api/status)
          printf '%s' "$body" | python3 -c '
          import json, sys, datetime as dt
          d = json.load(sys.stdin)
          at = d.get("updatedAt")
          if not at:
              print("::error::/api/status has no updatedAt — the cron has never written a snapshot")
              sys.exit(1)
          age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(at.replace("Z", "+00:00"))).total_seconds() / 60
          down = ", ".join(r["name"] for r in d.get("results", []) if not r.get("ok")) or "none"
          print(f"snapshot age: {age:.1f} min; monitors down: {down}")
          if age > 25:
              print(f"::error::status snapshot is {age:.0f} min old — the 5-minute cron (or its KV write) has stopped")
              sys.exit(1)
          '

      # The snapshot above lives in KV; nothing else here touches D1, and a
      # dead D1 once went unnoticed for days (docs/history.md). /api/geo is a
      # D1 read that answers 503 when the read fails; curl retries a 503.
      - name: Visitor data (D1) answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 \
            -A 'status-watchdog/1.0 (+https://github.com/RozDm/RozDm)' https://rozsoshnykh.no/api/geo)
          echo "GET /api/geo -> $code"
          [ "$code" = "200" ] || { echo "::error::/api/geo answered $code — D1 read failed (Workers Logs: 'geo: D1 read failed')"; exit 1; }

      # The Trends chart reads Analytics Engine with the AE_API_TOKEN secret.
      # When AE fails (an expired or revoked token, an AE outage) the endpoint
      # still answers 200 with an empty series, flagged `degraded` — the chart
      # then just looks quiet. Degraded answers are edge-cached only 20 s
      # (under the 30 s between tries), so a retry asks AE again; three in a
      # row is not a blip.
      - name: Time series (Analytics Engine) answers
        run: |
          for try in 1 2 3; do
            body=$(curl -sf --max-time 20 -A 'status-watchdog/1.0 (+https://github.com/RozDm/RozDm)' \
              'https://rozsoshnykh.no/api/timeseries?metric=geo&range=24h') || body=''
            if printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if "points" in d and not d.get("degraded") else 1)' 2>/dev/null; then
              echo "GET /api/timeseries -> AE answered (try $try)"
              exit 0
            fi
            echo "try $try: degraded or no answer"
            [ "$try" = 3 ] || sleep 30
          done
          echo "::error::/api/timeseries is degraded — AE read failed (Workers Logs: 'timeseries: AE …'; check the AE_API_TOKEN secret)"
          exit 1

      # The Worker mails the contact form's messages and the outage alerts; a
      # failed send can't be reported by mail. Each one writes an AE point
      # (blob1 = 'mailfail'). Last, so the checks above always run; 24 h, so a
      # failure between two runs (hours apart) isn't missed — one failure
      # keeps this red for a day. A degraded answer is the step above's to
      # report, not this one's.
      - name: No mail failed to send (last 24 h)
        run: |
          body=$(curl -sf --max-time 20 --retry 2 --retry-delay 10 -A 'status-watchdog/1.0 (+https://github.com/RozDm/RozDm)' \
            'https://rozsoshnykh.no/api/timeseries?metric=mailfail&range=24h') || body='{}'
          failed=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(0 if d.get("degraded") else int(sum(p.get("value", 0) for p in d.get("points", []))))' 2>/dev/null || echo 0)
          echo "mails that failed to send in 24 h: $failed"
          [ "$failed" = 0 ] || { echo "::error::$failed mail(s) failed to send in the last 24 h — contact form or status alert (Workers Logs: 'mail send failed' / 'alert mail failed'; analytics-report.yml says which)"; exit 1; }

  # The Worker runs on Free: 10 ms of CPU per request or cron run, then error
  # 1102 — on /api/contact a lost message. Nothing else watches the growth
  # (p99.9 was 9.7 ms on 2026-11-16, before the contact route went from four
  # D1 calls to one). This reads the last 24 h from the GraphQL Analytics API
  # (workersInvocationsAdaptive, units µs) and fails on p99.9 > 8 ms or any
  # Worker error; GitHub mails the failure. AE_API_TOKEN (Account Analytics:
  # Read) covers it. Its own slots, not every watchdog run: a job in the
  # production environment records a deployment each time.
  cpu:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '44 1,7,13,19 * * *'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Worker CPU (last 24 h)
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.AE_API_TOKEN }}
          P999_MAX_MS: '8'
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          query = '''query($a: String!, $f: Time!, $t: Time!) { viewer { accounts(filter: {accountTag: $a}) {
            workersInvocationsAdaptive(limit: 10, filter: {datetime_geq: $f, datetime_leq: $t}) {
              dimensions { scriptName } quantiles { cpuTimeP50 cpuTimeP99 cpuTimeP999 } max { cpuTime } sum { requests errors } } } } }'''
          body = json.dumps({'query': query, 'variables': {
              'a': os.environ['ACCOUNT_ID'],
              'f': (now - dt.timedelta(days=1)).strftime('%Y-%m-%dT%H:%M:%SZ'),
              't': now.strftime('%Y-%m-%dT%H:%M:%SZ')}}).encode()
          req = urllib.request.Request('https://api.cloudflare.com/client/v4/graphql', body, {
              'Authorization': f"Bearer {os.environ['API_TOKEN']}", 'Content-Type': 'application/json'})
          try:
              d = json.load(urllib.request.urlopen(req, timeout=30))
              rows = [r for r in d['data']['viewer']['accounts'][0]['workersInvocationsAdaptive']
                      if r['dimensions']['scriptName'] == 'd']
          except Exception as e:
              print(f"::error::GraphQL read failed ({e}; {str(locals().get('d', ''))[:300]}) — check the AE_API_TOKEN secret (Account Analytics: Read)")
              sys.exit(1)
          if not rows:
              print('no Worker invocations in 24 h'); sys.exit(0)
          r = rows[0]; q = r['quantiles']; ms = lambda us: us / 1000
          print(f"24 h: {r['sum']['requests']} invocations, {r['sum']['errors']} errors; CPU p50 {ms(q['cpuTimeP50']):.1f} ms, "
                f"p99 {ms(q['cpuTimeP99']):.1f} ms, p99.9 {ms(q['cpuTimeP999']):.1f} ms, max {ms(r['max']['cpuTime']):.1f} ms (Free's limit: 10 ms)")
          fail = False
          if ms(q['cpuTimeP999']) > float(os.environ['P999_MAX_MS']):
              print(f"::error::Worker CPU p99.9 is {ms(q['cpuTimeP999']):.1f} ms (> {os.environ['P999_MAX_MS']} ms of Free's 10) — the heaviest events: Workers Observability, filter cpuTimeMs > 6 (src/CLAUDE.md)")
              fail = True
          if r['sum']['errors'] > 0:
              print(f"::error::{r['sum']['errors']} Worker invocation(s) failed in 24 h — 1102 = CPU limit exceeded (Workers Logs)")
              fail = True
          sys.exit(1 if fail else 0)
          PY
