# Shared job setup: Node from .nvmrc, then `npm ci`. The caller checks out
# first (a local action lives in the checkout). The defaults are the ones a
# job reading a secret needs, so a new workflow is safe without inputs: no
# npm cache (a job running package code could have written it) and no
# install scripts (no package code next to a token). Only jobs without
# secrets opt out (tests/repo/workflows.test.ts).
name: Setup
description: setup-node from .nvmrc, then npm ci (no cache, no install scripts unless asked)
inputs:
  cache:
    description: "'true' restores and saves the npm cache — only in a job without secrets"
    default: 'false'
  ignore-scripts:
    description: "'false' lets package install scripts run — only in a job without secrets"
    default: 'true'
runs:
  using: composite
  steps:
    # package-manager-cache stays off with the cache: it would turn caching
    # on by itself the day package.json gains a packageManager field.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        package-manager-cache: ${{ inputs.cache == 'true' }}

    - shell: bash
      run: npm ci ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
